packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-forge: false
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
overrides:
  # Jimp 1.6.1 的公开参数校验迁移到安全 Zod 4；print 函数 schema 由精确 patch 保留语义。
  "@jimp/plugin-blit@1.6.1>zod": 4.6.6
  "@jimp/plugin-circle@1.6.1>zod": 4.6.6
  "@jimp/plugin-color@1.6.1>zod": 4.6.6
  "@jimp/plugin-contain@1.6.1>zod": 4.6.6
  "@jimp/plugin-cover@1.6.1>zod": 4.6.6
  "@jimp/plugin-crop@1.6.1>zod": 4.6.6
  "@jimp/plugin-displace@1.6.1>zod": 4.6.6
  "@jimp/plugin-fisheye@1.6.1>zod": 4.6.6
  "@jimp/plugin-flip@1.6.1>zod": 4.6.6
  "@jimp/plugin-mask@1.6.1>zod": 4.6.6
  "@jimp/plugin-print@1.6.1>zod": 4.6.6
  "@jimp/plugin-quantize@1.6.1>zod": 4.6.6
  "@jimp/plugin-resize@1.6.1>zod": 4.6.6
  "@jimp/plugin-rotate@1.6.1>zod": 4.6.6
  "@jimp/plugin-threshold@1.6.1>zod": 4.6.6
  "@jimp/types@1.6.1>zod": 4.6.6
  "@modelcontextprotocol/client": "2.3.0"
  "@modelcontextprotocol/core": "2.3.0"
  "@modelcontextprotocol/server": "2.3.0"
  axios: ^1.16.0
  basic-ftp: 6.2.1
  brace-expansion@^1: 1.1.20
  brace-expansion@^2: 2.1.6
  brace-expansion@^5: ^5.0.9
  browserslist: ^4.28.7
  builder-util-runtime: ^9.7.0
  dompurify: 3.4.17
  "exceljs@4.4.0>unzipper": 0.12.5
  extract-zip: workspace:@uwork/safe-extract-zip@*
  fast-uri: ^3.1.7
  follow-redirects@1.16.0: 1.16.1
  form-data@^4: ^4.0.6
  hono: ^4.12.25
  ip-address: ^10.3.1
  js-yaml@^4: ^4.3.2
  linkify-it: ^5.0.2
  nanoid@^3: ^3.3.18
  nanoid@^5: ^5.1.16
  node-forge: https://codeload.github.com/digitalbazaar/forge/tar.gz/ceba34402e329f0365134f23fe19898756527d65
  postcss: ^8.5.18
  protobufjs@^7: ^7.6.1
  react: 19.2.7
  react-dom: 19.2.7
  shell-quote: ^1.9.0
  smol-toml: ^1.7.1
  source-map-js: 1.2.2
  tmp@^0.2: 0.2.7
  undici@^6: 6.29.1
  undici@^7: 7.30.1
  ws@8.18.0: ^8.21.0
  ws@^8: ^8.21.0
packageExtensions:
  "playwright-core@1.59.1":
    dependencies:
      "@uwork/safe-extract-zip": workspace:*
patchedDependencies:
  "@ai-sdk/anthropic@3.0.81": patches/@ai-sdk__anthropic@3.0.81.patch
  "@ai-sdk/openai-compatible@2.0.60": patches/@ai-sdk__openai-compatible@2.0.60.patch
  "@arms/rum-electron@0.0.3": patches/@arms__rum-electron@0.0.3.patch
  "@jimp/plugin-print@1.6.1": patches/@jimp__plugin-print@1.6.1.patch
  "@radix-ui/react-collapsible@1.1.12": patches/@radix-ui__react-collapsible@1.1.12.patch
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
  playwright-core@1.59.1: patches/playwright-core@1.59.1.patch
  unzipper@0.12.5: patches/unzipper@0.12.5.patch
  vitest@4.1.7: patches/vitest@4.1.7.patch
  wdio-electron-service@9.2.1: patches/wdio-electron-service@9.2.1.patch
supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
  os:
    - current
    - darwin
    - linux
    - win32
