name: Sync release to GitLab

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to latest published release)
        required: false
        type: string
      inspect_only:
        description: Read target references without uploading or changing anything
        type: boolean
        default: false
      cleanup_source:
        description: One-time authorized migration from source mirror to release files only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gitlab-release-sync
  cancel-in-progress: false

env:
  GITLAB_BASE_URL: ${{ vars.GITLAB_BASE_URL || 'http://g.ucas.com.cn:8088' }}
  GITLAB_PROJECT_PATH: ${{ vars.GITLAB_PROJECT_PATH || 'lijingping/uwork' }}

jobs:
  contract:
    name: Validate sync contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: node --test scripts/test/gitlab-release-*.test.mjs

  sync:
    name: Publish three installers to GitLab
    needs: contract
    runs-on: ${{ vars.GITLAB_SYNC_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Resolve release tag
        id: options
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ -z "$tag" ]]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid Release tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Fetch release metadata
        if: inputs.inspect_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.options.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"

      - name: Download release installers (DMG, EXE, DEB)
        if: inputs.inspect_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.options.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/selected-assets.txt"
          import { readFile } from 'node:fs/promises';
          import { selectGitLabReleaseAssets } from './scripts/sync-gitlab-release.mjs';
          const release = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/release.json`, 'utf8'));
          for (const asset of selectGitLabReleaseAssets(release).assets) console.log(asset.name);
          JS
          while IFS= read -r asset; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets" --pattern "$asset"
          done < "$RUNNER_TEMP/selected-assets.txt"

      - name: Publish and verify GitLab release files
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          RELEASE_TAG: ${{ steps.options.outputs.tag }}
          RELEASE_JSON: ${{ runner.temp }}/release.json
          ASSET_DIR: ${{ runner.temp }}/release-assets
          INSPECT_ONLY: ${{ inputs.inspect_only || false }}
          CLEANUP_SOURCE: ${{ inputs.cleanup_source || false }}
          SYNC_REPORT: ${{ runner.temp }}/gitlab-release-verification.json
        run: node scripts/sync-gitlab-release.mjs

      - name: Save reference and asset verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitlab-release-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/gitlab-release-verification.json
          if-no-files-found: ignore
          retention-days: 7
