name: Sync release to GitLab

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (defaults to the latest published release)
        required: false
        type: string
      upload_assets:
        description: Upload installer assets to the GitLab package registry
        required: false
        type: boolean
        default: false
      force_branch:
        description: Overwrite the GitLab branch with the release commit (force-with-lease)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gitlab-release-sync-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GITLAB_BASE_URL: ${{ vars.GITLAB_BASE_URL || 'http://g.ucas.com.cn:8088' }}
  GITLAB_PROJECT_PATH: ${{ vars.GITLAB_PROJECT_PATH || 'lijingping/uwork' }}
  SYNC_BRANCH: ${{ vars.GITLAB_SYNC_BRANCH || 'main' }}
  GITLAB_SYNC_ASSETS: ${{ vars.GITLAB_SYNC_ASSETS }}
  GITLAB_SYNC_FORCE_BRANCH: ${{ vars.GITLAB_SYNC_FORCE_BRANCH }}

jobs:
  contract:
    name: Validate sync contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: node --test scripts/test/gitlab-release-sync.test.mjs

  sync:
    name: Push release to GitLab
    needs: contract
    # 校内地址需要自托管 runner 时，用仓库变量 GITLAB_SYNC_RUNNER 覆盖默认托管 runner。
    runs-on: ${{ vars.GITLAB_SYNC_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Resolve release tag and sync options
        id: options
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPLOAD_ASSETS: ${{ inputs.upload_assets }}
          INPUT_FORCE_BRANCH: ${{ inputs.force_branch }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ -z "$tag" ]]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "非法 Release tag: $tag" >&2
            exit 1
          fi
          upload_assets="${INPUT_UPLOAD_ASSETS:-${GITLAB_SYNC_ASSETS:-false}}"
          force_branch="${INPUT_FORCE_BRANCH:-${GITLAB_SYNC_FORCE_BRANCH:-false}}"
          case "$upload_assets" in
            true|false) ;;
            *) echo "upload_assets 必须是 true 或 false：$upload_assets" >&2; exit 1 ;;
          esac
          case "$force_branch" in
            true|false) ;;
            *) echo "force_branch 必须是 true 或 false：$force_branch" >&2; exit 1 ;;
          esac
          {
            echo "tag=$tag"
            echo "upload_assets=$upload_assets"
            echo "force_branch=$force_branch"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 检出默认分支以运行最新同步脚本；标签由 fetch-tags 取回，用于定位 Release 提交。
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Verify the GitLab token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITLAB_TOKEN:-}" ]]; then
            echo "缺少 GITLAB_TOKEN secret，请在 Settings → Secrets and variables → Actions 中配置带 api 与 write_repository 权限的令牌。" >&2
            exit 1
          fi

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.options.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          test -s "$RUNNER_TEMP/release.json"

      - name: Download release assets
        if: steps.options.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.options.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"
          test -n "$(ls -A "$RUNNER_TEMP/release-assets")"

      - name: Sync tag, branch, release and assets to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PUSH_URL: ${{ vars.GITLAB_PUSH_URL }}
          RELEASE_TAG: ${{ steps.options.outputs.tag }}
          RELEASE_JSON: ${{ runner.temp }}/release.json
          UPLOAD_ASSETS: ${{ steps.options.outputs.upload_assets }}
          FORCE_BRANCH: ${{ steps.options.outputs.force_branch }}
          ASSET_DIR: ${{ steps.options.outputs.upload_assets == 'true' && format('{0}/release-assets', runner.temp) || '' }}
        run: node scripts/sync-gitlab-release.mjs
