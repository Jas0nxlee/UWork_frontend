name: Sync release to WeCom Drive
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Non-reversible fingerprints of existing local subscription nodes
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    name: Read-only fixed proxy connectivity investigation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Compare configuration fingerprints and independently probe both public endpoints
        env:
          WECOM_PROXY_CONFIG: ${{ secrets.WECOM_PROXY_CONFIG }}
          PROXY_CANDIDATES: ${{ inputs.candidates }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { createConnection } from 'node:net';
          import { execFile as callbackExec } from 'node:child_process';
          import { promisify } from 'node:util';
          import { withWecomProxy, buildProxyConfig } from './scripts/wecom-release-proxy.mjs';
          const execFile = promisify(callbackExec);
          const config = JSON.parse(process.env.WECOM_PROXY_CONFIG);
          buildProxyConfig(process.env.WECOM_PROXY_CONFIG);
          const hash = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const identity = node => [node.type,node.uuid,node['reality-opts']['public-key'],node['reality-opts']['short-id']];
          const key = hash(identity(config));
          const endpoint = hash([...identity(config),config.server,config.port]);
          const candidates = JSON.parse(process.env.PROXY_CANDIDATES);
          if (!Array.isArray(candidates) || candidates.length !== 3 || candidates.some(c => !['SG-vless','JP-vless','US-vless'].includes(c.name) || !/^[a-f0-9]{64}$/.test(c.key) || !/^[a-f0-9]{64}$/.test(c.endpoint))) throw new Error('Invalid comparison metadata');
          const match = candidates.find(c => c.key === key);
          console.log(JSON.stringify({knownSubscriptionNode:match?.name ?? 'unmatched',endpointMatchesCurrentSubscription:match ? match.endpoint === endpoint : null,configuredPortMatchesCurrentSubscription:config.port === 24567}));
          const codes = new Set(['ECONNREFUSED','ECONNRESET','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','EHOSTUNREACH','ENETUNREACH','UND_ERR_CONNECT_TIMEOUT','UND_ERR_SOCKET']);
          const nodeTcp = await new Promise(resolve => {
            const socket = createConnection({host:config.server,port:config.port});
            let settled = false;
            const finish = result => { if(settled) return; settled=true;socket.destroy();resolve(result); };
            socket.setTimeout(5000,()=>finish({target:'configured-node-tcp',result:'timeout'}));
            socket.once('connect',()=>finish({target:'configured-node-tcp',result:'connected'}));
            socket.once('error',error=>finish({target:'configured-node-tcp',result:'network',...(codes.has(error.code)?{code:error.code}:{})}));
          });
          console.log(JSON.stringify(nodeTcp));
          await withWecomProxy({probeOnly:true,probe:async (env,_child,signal)=>{
            const source = `
              const codes = new Set(${JSON.stringify([...codes])});
              const targets = [['ip-query','https://api.ipify.org?format=json'],['wecom-api','https://qyapi.weixin.qq.com/cgi-bin/gettoken']];
              const results = [];
              for (const [stage,url] of targets) {
                try {
                  const response=await fetch(url,{signal:AbortSignal.timeout(12000),redirect:'error'});
                  const body=await response.json();
                  results.push({stage,result:'http',status:response.status,validShape:stage==='ip-query'?typeof body?.ip==='string':Number.isInteger(body?.errcode)});
                } catch(error) {
                  const code=error?.cause?.code ?? error?.code;
                  results.push({stage,result:error?.name==='TimeoutError'?'timeout':'network',...(codes.has(code)?{code}:{})});
                }
              }
              process.stdout.write(JSON.stringify(results));
            `;
            const {stdout}=await execFile(process.execPath,['--use-env-proxy','--input-type=module','-e',source],{env,signal,timeout:30000,maxBuffer:4096});
            const results=JSON.parse(stdout);
            for (const result of results) console.log(JSON.stringify(result));
          }});
          JS
