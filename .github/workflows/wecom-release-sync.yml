name: Prepare one-time WeCom release target directory

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Base64 PEM RSA public key for encrypted target handoff
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: wecom-release-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/wecom-target-directory-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Validate the bounded target preparation contract
        run: node --test scripts/test/wecom-target-directory.test.mjs scripts/test/wecom-release-bootstrap.test.mjs scripts/test/wecom-release-client.test.mjs scripts/test/wecom-release-proxy.test.mjs
      - name: Prepare the existing space child directory and safe inventory
        env:
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
          WECOM_SPACE_ID: ${{ vars.WECOM_SPACE_ID || secrets.WECOM_SPACE_ID }}
          WECOM_PROXY_CONFIG: ${{ secrets.WECOM_PROXY_CONFIG }}
          WECOM_TARGET_PUBLIC_KEY: ${{ inputs.public_key }}
          TARGET_HANDOFF: ${{ runner.temp }}/wecom-target-encrypted.json
          TARGET_REPORT: ${{ runner.temp }}/wecom-target-inventory.json
        run: node scripts/wecom-target-directory.mjs
      - name: Preserve the encrypted target and safe inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wecom-target-directory-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wecom-target-encrypted.json
            ${{ runner.temp }}/wecom-target-inventory.json
          if-no-files-found: ignore
          retention-days: 1
